name: Selenium Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      min_pass_rate:
        description: "Minimum pass rate % for the quality gate (0 = disabled)"
        required: false
        default: "0"
  schedule:
    - cron: "0 2 * * *" # nightly regression, 02:00 UTC

concurrency:
  group: selenium-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selenium:
    name: Selenium + Pytest (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:3000
      HEADLESS: "1"
      MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0' }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          mkdir -p testing/reports
          nohup npm start > testing/reports/server.log 2>&1 &
          echo "Waiting for $BASE_URL/bank/login ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/bank/login" || true)
            if [ "$code" = "200" ]; then echo "App is up (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "App did not become ready within 120s"; cat testing/reports/server.log; exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: testing/requirements.txt

      - name: Install test dependencies
        run: pip install -r testing/requirements.txt

      - name: Run Selenium tests
        id: pytest
        working-directory: testing
        run: |
          set +e
          python -m pytest
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: testing/reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Quality gate
        if: always()
        working-directory: testing
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
        run: python scripts/quality_gate.py
