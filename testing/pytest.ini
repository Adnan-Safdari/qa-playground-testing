[pytest]
# BankTest — SecureBank Selenium regression suite.
# Report paths are relative to testing/ (conftest.py anchors them there).
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
junit_suite_name = securebank-regression
junit_family = xunit2
junit_logging = system-out
markers =
    testcase(tc_id): links the test to its entry in test_cases.json (e.g. SB-TR-01)
    critical: business-critical case; a failure fails the CI quality gate
    open_application: Open Application module
    create_account: Create New Account module
    transfer: Money Transfer module
    authentication: Authentication module
    logout: Logout module
    profile: Profile module
    change_password: Change Password module
filterwarnings =
    ignore::DeprecationWarning:pytest_html.*
